name: Add a library
description: Request coverage of a C# / .NET PDF library or API
title: "[Add library] <library>"
labels: ["new-library"]
body:
  - type: input
    id: name
    attributes:
      label: Library name
    validations:
      required: true
  - type: input
    id: nuget
    attributes:
      label: NuGet package or API documentation link
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - HTML to PDF converter
        - PDF generation / editing library
        - REST API / hosted service
        - Self-hosted service
        - Reporting engine
        - Other
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why should it be covered?
      description: Optional — what you use it for, or what you would compare it against
  - type: dropdown
    id: vendor
    attributes:
      label: Are you affiliated with this library's vendor?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
